# ClaudeConfig/models.toml   (top level, beside settings.json; ~/.ccs/models.toml links here)
#
# Source of truth for model AVAILABILITY. Says nothing about what a model is for;
# that is AGENTS.md and the seats. Canonical IDs only: exactly what the gateway's
# /v1/models returns. Claude Code direct spellings ([1m]) are derived from the
# family, never written here.

version = 1
gateway = "http://127.0.0.1:8317"

[defaults]
enrich_model = "gpt-5.6-sol(medium)"   # ccs session enrichment: read-and-classify, not reasoning

# ── Families: one context-window contract each ─────────────────────────────
# window     : the model's real context limit (what opencode and T3 are told)
# accounting : how Claude Code learns the window on claudex. Exactly one of:
#   "marker"     append [1m]; Claude Code recognizes the Claude ID and uses 1M
#   "behaves_as" map to a known Claude ID; Claude Code uses THAT model's window
#   "envelope"   no mapping; Claude Code uses the process-wide max_context slot
# Claude Code has no per-model context field for custom IDs, so a model whose
# window matches neither 200K nor the envelope is accounted for approximately.

[[family]]
name = "claude-1m"
window = 1000000
accounting = "marker"
marker = "[1m]"
prefixes = ["claude-fable-", "claude-opus-", "claude-sonnet-"]

[[family]]
name = "claude-200k"
window = 200000
accounting = "marker"        # bare ID, Claude Code knows it as 200K
marker = ""
prefixes = ["claude-haiku-"]

[[family]]
name = "gpt-5.6"
window = 921000
accounting = "envelope"      # NEVER behaves_as: it drops the row to the Claude model's 200K
prefixes = ["gpt-5.6-"]

[[family]]
name = "grok"
window = 500000              # xAI's limit for 4.5 and 4.6
accounting = "behaves_as"    # DECISION: 200K accounted, 300K left on the table. The envelope
behaves_as = "claude-sonnet-5"  # alternative is 921K, which overruns 500K mid-session and fails
prefixes = ["grok-"]         # late. Undercount is the safe error. Revisit if Claude Code gains
                             # a per-row context field or a 500K Claude ID appears.
                             # The donor is any bare Claude 5 ID: behavesAs lends its prompt
                             # profile, effort controls, and 200K accounting, and sends grok-*
                             # unchanged. Sonnet 5 implies no resemblance; it is the 200K
                             # Claude ID with the effort slider.

[[family]]
name = "glm"
window = 1000000             # 1M upstream on every lane
accounting = "envelope"      # 921K accounted, fits under the real window; today's behavesAs
prefixes = ["glm-"]          # row is a 200K degradation and gets removed

# ── Active models ──────────────────────────────────────────────────────────
# launchers : Claude Code launchers whose picker and allowlist carry the row
# clients   : every active model goes to every other client (opencode, T3, ...)
#             by default; hermes discovers live. There is no per-row opt-out.
# clients   : other harnesses that need an explicit entry (hermes discovers live)
# birth     : accepted as a ccs managed-birth model
# picker    : shown in /model (false = allowlisted, not offered)

[[model]]
id = "claude-fable-5-1"
family = "claude-1m"
provider = "claude"                   # cliproxyapi OAuth lane
launchers = ["claudex", "claude-native"]
label = "Fable 5.1"
short = "Fable"
description = "Hard-problem orchestrator, taste and judgment (Claude sub, Fable half)"
color = "#a689c9"
price = { input = 10, output = 50 }
birth = true
picker = true

