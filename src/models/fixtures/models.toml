# ── Launcher tier slots ────────────────────────────────────────────────────
# Values are canonical IDs plus an optional effort suffix; the generator applies
# the family marker. claude-native has no table: it clears every override and
# lets Claude Code's own defaults stand.

[slots.claudex]
fable  = "claude-fable-5-1"           # -> ANTHROPIC_DEFAULT_FABLE_MODEL=claude-fable-5-1[1m]
opus   = "claude-opus-5"
sonnet = "gpt-5.6-sol"
haiku  = "gpt-5.6-luna(low)"
subagent = "gpt-5.6-luna(xhigh)"      # -> CLAUDE_CODE_SUBAGENT_MODEL
max_context = 921000                  # -> CLAUDE_CODE_MAX_CONTEXT_TOKENS, the GPT-5.6 envelope
auto_compact = 1000000                # -> CLAUDE_CODE_AUTO_COMPACT_WINDOW

